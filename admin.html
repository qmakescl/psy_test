<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>진행자 화면 — 외향성 알아보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <span class="topbar__title">진행자 화면</span>
  <span class="topbar__user"><button class="btn btn--small" type="button" id="logout" hidden>로그아웃</button></span>
</header>

<main class="page page--wide">

  <!-- 진행자 로그인 -->
  <section id="login-view" hidden>
    <div class="card" style="max-width:420px;margin:40px auto">
      <h1>진행자 로그인</h1>
      <form id="login-form">
        <label class="field"><span class="field__label">진행자 비밀번호</span>
          <input type="password" id="admin-password" autocomplete="current-password"></label>
        <p class="note note--error" id="login-error" role="alert" hidden></p>
        <button class="btn btn--primary btn--block" type="submit">로그인</button>
      </form>
    </div>
  </section>

  <!-- 대시보드 -->
  <section id="dash-view" hidden>
    <div class="card">
      <div class="admin-head">
        <div><div class="small muted">현재 회차</div><b id="current-session"></b></div>
        <div><span class="badge" id="phase-badge"></span></div>
        <div><div class="small muted">보는 회차</div>
          <select id="view-session" class="btn btn--small" aria-label="보는 회차"></select></div>
      </div>
      <div class="controls">
        <button class="btn btn--small btn--primary" type="button" id="toggle-phase"></button>
        <label><input type="checkbox" id="allow-guest"> 게스트 응답 허용</label>
        <span><input type="text" id="session-input" aria-label="새 회차 코드" placeholder="새 회차 코드">
          <button class="btn btn--small" type="button" id="session-save">회차 변경</button></span>
        <a class="small" href="data/sample_practice.csv" download>실습용 합성 CSV 내려받기</a>
      </div>
      <p class="note note--error" id="settings-error" role="alert" hidden></p>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-view="live" aria-selected="true">① 현황</button>
      <button type="button" role="tab" data-view="items" aria-selected="false">② 문항별 통계</button>
      <button type="button" role="tab" data-view="analysis" aria-selected="false">③ 통계분석</button>
      <button type="button" role="tab" data-view="sessions" aria-selected="false">④ 회차 비교</button>
    </div>
    <div class="btn-row" style="margin:0 0 12px" id="recalc-row" hidden>
      <button class="btn btn--small" type="button" id="recalc">다시 계산</button>
    </div>
    <div id="panel"></div>
  </section>

</main>

<script type="module" src="admin.js"></script>
</body>
</html>
